<body class="bg-canvas text-light-on-surface font-body antialiased">
  <main class="min-h-[884px] max-w-[393px] mx-auto px-page-margin pb-8 flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div>
      <header class="relative h-14 flex items-center justify-between">
        <a href="../auth-login/Masuk.html" aria-label="Kembali ke halaman masuk" class="w-12 h-12 -ml-3 rounded-full inline-flex items-center justify-center text-light-on-surface hover:bg-light-surface-container-low">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">arrow_back</span>
        </a>
        <h1 class="font-headline text-title-lg text-light-on-surface absolute left-1/2 -translate-x-1/2">Tautkan Gmail</h1>
        <div class="w-12 h-12"></div>
      </header>

      <!-- State preview switcher for reviewer -->
      

      <div class="flex flex-col gap-5">
        <div class="w-14 h-14 rounded-2xl bg-accent text-on-accent inline-flex items-center justify-center">
          <span class="material-symbols-outlined text-[28px]" aria-hidden="true">mail</span>
        </div>

        <div class="flex flex-col gap-2">
          <h2 class="font-headline text-headline-md text-light-on-surface text-balance">
            Baca notifikasi Livin&#39; otomatis
          </h2>
          <p class="font-body text-body-md text-light-on-surface-variant text-pretty">
            Opsional. Hanya membaca email notifikasi Livin&#39; by Mandiri.
          </p>
        </div>

        <div class="bg-light-surface border border-light-outline-variant rounded-2xl p-4 flex flex-col gap-3">
          <div class="flex items-start gap-3">
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant mt-0.5" aria-hidden="true">visibility</span>
            <p class="font-body text-body-sm text-light-on-surface-variant">Akses baca-saja untuk email notifikasi.</p>
          </div>
          <div class="flex items-start gap-3">
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant mt-0.5" aria-hidden="true">tune</span>
            <p class="font-body text-body-sm text-light-on-surface-variant">Izin AI diatur terpisah di Pengaturan.</p>
          </div>
        </div>

        <!-- Dynamic state feedback box -->
        <div id="state-box" class="hidden rounded-xl p-4"></div>
      </div>
    </div>

    <div class="flex flex-col gap-3 pt-6">
      <button id="btn-link" type="button" onclick="startAuth()" class="w-full min-h-[48px] px-6 py-3 rounded-lg bg-accent text-on-accent inline-flex items-center justify-center gap-2 transition-opacity duration-state-change hover:opacity-90">
        <span data-design-text-token="label-lg" class="font-label text-label-lg" id="btn-link-label">Tautkan Gmail</span>
      </button>

      <a id="btn-skip" href="../summary/Ringkasan.html" class="w-full min-h-[48px] px-6 py-3 rounded-lg bg-light-surface border border-light-outline-variant text-light-on-surface inline-flex items-center justify-center transition-colors duration-state-change hover:bg-light-surface-container-low">
        <span data-design-text-token="label-lg" class="font-label text-label-lg" id="btn-skip-label">Lewati</span>
      </a>
    </div>
  </main>

  <script>
    function setState(state) {
      var tabs = ['idle', 'loading', 'success', 'cancelled'];
      tabs.forEach(function(t) {
        var el = document.getElementById('tab-' + t);
        if (!el) return;
        if (t === state) {
          el.className = 'min-h-[36px] px-3 py-1.5 rounded-full font-label text-label-md bg-light-primary text-light-on-primary';
        } else {
          el.className = 'min-h-[36px] px-3 py-1.5 rounded-full font-label text-label-md bg-light-surface border border-light-outline-variant text-light-on-surface-variant';
        }
      });

      var box = document.getElementById('state-box');
      var btnLink = document.getElementById('btn-link');
      var btnLinkLabel = document.getElementById('btn-link-label');
      var btnSkip = document.getElementById('btn-skip');
      var btnSkipLabel = document.getElementById('btn-skip-label');

      if (state === 'idle') {
        box.className = 'hidden';
        box.innerHTML = '';
        btnLink.disabled = false;
        btnLink.className = 'w-full min-h-[48px] px-6 py-3 rounded-lg bg-accent text-on-accent inline-flex items-center justify-center gap-2';
        btnLinkLabel.textContent = 'Tautkan Gmail';
        btnLink.onclick = startAuth;
        btnSkip.classList.remove('hidden');
        btnSkipLabel.textContent = 'Lewati';
      } else if (state === 'loading') {
        box.className = 'rounded-xl p-4 bg-light-surface-container-low border border-light-outline-variant flex items-center gap-3';
        box.innerHTML = '<span class="material-symbols-outlined text-[20px] text-light-on-surface animate-spin" aria-hidden="true">progress_activity</span><div><p class="font-label text-label-lg text-light-on-surface">Menunggu izin Google...</p><p class="font-body text-body-sm text-light-on-surface-variant">Selesaikan persetujuan akses Gmail di jendela otorisasi.</p></div>';
        btnLink.disabled = true;
        btnLink.className = 'w-full min-h-[48px] px-6 py-3 rounded-lg bg-light-surface-container text-light-outline inline-flex items-center justify-center gap-2 cursor-not-allowed';
        btnLinkLabel.textContent = 'Memproses otorisasi...';
        btnSkip.classList.remove('hidden');
        btnSkipLabel.textContent = 'Batalkan';
      } else if (state === 'success') {
        box.className = 'rounded-xl p-4 bg-light-success-container text-light-on-success-container flex items-center gap-3';
        box.innerHTML = '<span class="material-symbols-outlined text-[22px]" aria-hidden="true">check_circle</span><div><p class="font-label text-label-lg">Gmail berhasil ditautkan</p><p class="font-body text-body-sm">nadya.pratama@gmail.com siap disinkronkan.</p></div>';
        btnLink.disabled = false;
        btnLink.className = 'w-full min-h-[48px] px-6 py-3 rounded-lg bg-light-primary text-light-on-primary inline-flex items-center justify-center gap-2';
        btnLinkLabel.textContent = 'Lanjut ke Ringkasan';
        btnLink.onclick = function() { window.location.href = '../summary/Ringkasan.html'; };
        btnSkip.classList.add('hidden');
      } else if (state === 'cancelled') {
        box.className = 'rounded-xl p-4 bg-light-warning-container text-light-on-warning-container flex items-start gap-3';
        box.innerHTML = '<span class="material-symbols-outlined text-[20px] mt-0.5" aria-hidden="true">info</span><div><p class="font-label text-label-lg">Penautan Gmail dibatalkan</p><p class="font-body text-body-sm">Anda tetap dapat mencatat transaksi secara manual atau mencoba menautkan lagi nanti.</p></div>';
        btnLink.disabled = false;
        btnLink.className = 'w-full min-h-[48px] px-6 py-3 rounded-lg bg-accent text-on-accent inline-flex items-center justify-center gap-2';
        btnLinkLabel.textContent = 'Coba lagi';
        btnLink.onclick = startAuth;
        btnSkip.classList.remove('hidden');
        btnSkipLabel.textContent = 'Lewati';
      }
    }

    function startAuth() {
      setState('loading');
      setTimeout(function() {
        setState('success');
      }, 1200);
    }
  </script>


</body></html>
