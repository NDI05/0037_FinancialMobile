# `docker compose up --build` — .env is optional; without it the container runs the fake LLM and
# NODE_ENV=production would refuse the dev defaults, so production secrets are required there.
services:
  pam-backend:
    build: .
    image: pam-backend:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/pam.db
    volumes:
      - pam-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pam-data:
